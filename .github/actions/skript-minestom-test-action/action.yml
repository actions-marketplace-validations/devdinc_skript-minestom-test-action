name: Skript Minestom Tests
description: Run Skript-MineStom runtime tests using the published JAR

inputs:
  version:
    description: Published Skript-MineStom version
    required: false
    default: 1.0.0-alpha.49

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'

    - name: Download Skript-MineStom
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        URL="https://maven.hapily.me/snapshots/com/github/hapily04/skriptminestom/skript-minestom/${VERSION}/skript-minestom-${VERSION}.jar"

        mkdir -p "$RUNNER_TEMP/skript-minestom"
        curl --fail --location --silent --show-error \
          "$URL" \
          --output "$RUNNER_TEMP/skript-minestom/skript-minestom.jar"

    - name: Prepare test scripts
      shell: bash
      run: |
        set -euo pipefail

        SERVER_DIR="$RUNNER_TEMP/skript-minestom"
        mkdir -p "$SERVER_DIR/plugins/Skript/scripts"

        curl --fail --location --silent --show-error \
          "https://raw.githubusercontent.com/miberss/pacskage/HEAD/package.sk" \
          --output "$SERVER_DIR/plugins/Skript/scripts/package.sk"

        cat > "$SERVER_DIR/plugins/Skript/scripts/ci-install-runtime-test-framework.sk" <<'SKRIPT'
        on load:
            if {ci::runtime-test-framework::reload-done} is true:
                stop

            execute console command "package install https://github.com/devdinc/skripts/#scripts/utils/runtime-test-framework"

            set {ci::runtime-test-framework::reload-done} to true
            execute console command "skript reload scripts"
        SKRIPT

    - name: Run runtime tests
      shell: bash
      run: |
        set -euo pipefail
        python3 "${{ github.action_path }}/run_tests.py" \
          "$RUNNER_TEMP/skript-minestom/skript-minestom.jar" \
          "$RUNNER_TEMP/skript-minestom"
