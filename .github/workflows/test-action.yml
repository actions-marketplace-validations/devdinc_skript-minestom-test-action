name: Test Skript Minestom Action

on:
  push:
    branches:
      - main
    paths:
      - 'action.yml'
      - 'run_tests.py'
      - '.github/workflows/test-action.yml'
      - 'tests/**'
  pull_request:
    paths:
      - 'action.yml'
      - 'run_tests.py'
      - '.github/workflows/test-action.yml'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        mode:
          - download
          - build

    name: Test (${{ matrix.mode }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create arithmetic tests
        shell: bash
        run: |
          mkdir -p tests
          cat > tests/arithmetic.sk <<'SKRIPT'
          # Arithmetic test cases for the runtime test framework.
          test "arithmetic":
              # Addition
              assert (2 + 3) is 5
              assert (10 + 0) is 10

              # Subtraction
              assert (9 - 4) is 5
              assert (7 - 7) is 0

              # Multiplication
              assert (6 * 7) is 42
              assert (8 * 0) is 0

              # Division
              assert (20 / 4) is 5
              assert (9 / 3) is 3
          SKRIPT

      - name: Run Skript Minestom tests
        uses: ./
        with:
          mode: ${{ matrix.mode }}
          version: latest
          test_script_directory: tests
