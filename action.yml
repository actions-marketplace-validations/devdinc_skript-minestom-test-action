name: 'Skript Minestom Tests'
description: 'Runs Skript runtime tests on Minestom'

inputs:
  test_script_directory:
    description: 'Directory containing the Skript test scripts'
    required: true

  version:
    description: 'Published Skript-MineStom Maven version'
    required: false
    default: '1.0.0-alpha.49'

runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'

    - name: Download Skript-MineStom
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        SERVER_DIR="$RUNNER_TEMP/skript-minestom"
        mkdir -p "$SERVER_DIR"

        URL="https://maven.hapily.me/snapshots/com/github/hapily04/skript-minestom/${VERSION}/skript-minestom-${VERSION}.jar"

        curl --fail --location --silent --show-error \
          "$URL" \
          --output "$SERVER_DIR/skript-minestom.jar"

    - name: Prepare Skript and test scripts
      shell: bash
      env:
        TEST_SCRIPT_DIRECTORY: ${{ inputs.test_script_directory }}
      run: |
        set -euo pipefail

        SERVER_DIR="$RUNNER_TEMP/skript-minestom"
        SCRIPTS_DIR="$SERVER_DIR/plugins/Skript/scripts"

        mkdir -p "$SCRIPTS_DIR"

        curl --fail --location --silent --show-error \
          "https://raw.githubusercontent.com/miberss/pacskage/HEAD/package.sk" \
          --output "$SCRIPTS_DIR/package.sk"

        cat > "$SCRIPTS_DIR/ci-install-runtime-test-framework.sk" <<'SKRIPT'
        on load:
            if {ci::runtime-test-framework::reload-done} is true:
                stop

            execute console command "package install https://github.com/devdinc/skripts/#scripts/utils/runtime-test-framework"

            set {ci::runtime-test-framework::reload-done} to true
            execute console command "skript reload scripts"
        SKRIPT

        if [ ! -d "$GITHUB_WORKSPACE/$TEST_SCRIPT_DIRECTORY" ]; then
          echo "::error::Test directory not found: $TEST_SCRIPT_DIRECTORY"
          exit 1
        fi

        cp -R "$GITHUB_WORKSPACE/$TEST_SCRIPT_DIRECTORY/." "$SCRIPTS_DIR/"

    - name: Run runtime tests
      shell: bash
      run: |
        set -euo pipefail

        timeout --signal=TERM --kill-after=10s 1m \
          setsid python3 -u "$GITHUB_ACTION_PATH/run_tests.py" \
            "$RUNNER_TEMP/skript-minestom/skript-minestom.jar" \
            "$RUNNER_TEMP/skript-minestom"

    # TEMPORARY: Find the actual Skript-Minestom scripts directory
    - name: TEMPORARY - Debug script directories
      shell: bash
      run: |
        echo "=== Directories ==="
        find "$RUNNER_TEMP/skript-minestom" -type d | sort

        echo "=== Skript files ==="
        find "$RUNNER_TEMP/skript-minestom" -type f -name '*.sk' | sort
