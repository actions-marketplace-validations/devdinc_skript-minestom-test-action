name: 'Skript Minestom Tests'
description: 'Runs Skript runtime tests on Minestom'

inputs:
  test_script_directory:
    description: 'Directory containing the Skript test scripts'
    required: true

  version:
    description: 'Published Skript-Minestom Maven version'
    required: false
    default: '1.0.0-alpha.49'

  timeout:
    description: 'Maximum time to wait for runtime tests (for example, 1m, 30s, or 5m)'
    required: false
    default: '45s'

runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'

    - name: Download Skript-Minestom
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        SERVER_DIR="$RUNNER_TEMP/skript-minestom"
        mkdir -p "$SERVER_DIR"

        URL="https://maven.hapily.me/snapshots/com/github/hapily04/skript-minestom/${VERSION}/skript-minestom-${VERSION}.jar"

        curl --fail --location --silent --show-error \
          "$URL" \
          --output "$SERVER_DIR/skript-minestom.jar"

    - name: Prepare Skript and test scripts
      shell: bash
      env:
        TEST_SCRIPT_DIRECTORY: ${{ inputs.test_script_directory }}
      run: |
        set -euo pipefail

        SERVER_DIR="$RUNNER_TEMP/skript-minestom"
        SCRIPTS_DIR="$SERVER_DIR/Skript/scripts"
        PLUGINS_DIR="$SERVER_DIR/Skript/addons"
        TEST_SOURCE="$GITHUB_WORKSPACE/$TEST_SCRIPT_DIRECTORY"

        if [ ! -d "$TEST_SOURCE" ]; then
          echo "::error::Test directory not found: $TEST_SCRIPT_DIRECTORY"
          exit 1
        fi

        mkdir -p "$SCRIPTS_DIR/tests" "$PLUGINS_DIR" "$SCRIPTS_DIR/0"

        # Download the runtime test framework directly.
        curl --fail --location --silent --show-error \
          "https://raw.githubusercontent.com/devdinc/skripts/dev/scripts/utils/runtime-test-framework/runtime-test-framework.sk" \
          --output "$SCRIPTS_DIR/0/runtime-test-framework.sk"

        # Download Skript-Reflect, required by the framework.
        curl --fail --location --silent --show-error \
          "https://github.com/SkriptLang/skript-reflect/releases/download/v2.6.3/skript-reflect-2.6.3.jar" \
          --output "$PLUGINS_DIR/skript-reflect-2.6.3.jar"

        # Copy the user's tests into the scripts directory.
        cp -R "$TEST_SOURCE/." "$SCRIPTS_DIR/tests/"

        echo "=== Prepared Skript files ==="
        find "$SCRIPTS_DIR" -type f -name '*.sk' | sort

    - name: Run runtime tests
      shell: bash
      env:
        TEST_TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail

        timeout --signal=TERM --kill-after=10s "$TEST_TIMEOUT" \
          setsid python3 -u "$GITHUB_ACTION_PATH/run_tests.py" \
            "$RUNNER_TEMP/skript-minestom/skript-minestom.jar" \
            "$RUNNER_TEMP/skript-minestom"
